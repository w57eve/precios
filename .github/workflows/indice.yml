name: Índice de imágenes (búsqueda por foto)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - "datos/**"
permissions:
  contents: write
concurrency:
  group: indice
  cancel-in-progress: false
jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restaurar caché (modelo + embeddings)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            _cache_indice
          key: indice-dinov2-${{ github.run_id }}
          restore-keys: |
            indice-dinov2-
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pillow requests numpy
      - name: Generar índice
        env:
          INDICE_CACHE: _cache_indice
        run: python tools/indexar.py
      - name: Publicar índice al repo
        run: |
          git config user.name "indice-bot"
          git config user.email "indice-bot@users.noreply.github.com"
          git add indice/img_vectores.bin indice/img_skus.json indice/img_meta.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el índice."
          else
            git commit -m "Índice de imágenes actualizado (DINOv2)"
            git push
          fi
